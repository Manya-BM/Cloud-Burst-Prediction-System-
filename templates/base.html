<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudBurst | {% block title %}Rainfall Risk{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand-md navbar-dark sticky-top"><div class="container">
 <a class="navbar-brand brand" href="{{ url_for('home') }}"><i class="bi bi-cloud-lightning-rain-fill"></i> CloudBurst</a>
 <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
 <div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto">
  <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='home' }}" href="{{ url_for('home') }}">Home</a></li>
  <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='dashboard' }}" href="{{ url_for('dashboard') }}">Dashboard</a></li>
  <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='about' }}" href="{{ url_for('about') }}">About</a></li></ul></div></div></nav>
{% block content %}{% endblock %}
<footer class="text-center py-4 mt-5"><div class="container">CloudBurst — educational extreme-rainfall risk prototype · Flask + scikit-learn · Not an official forecast</div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}</body></html>
